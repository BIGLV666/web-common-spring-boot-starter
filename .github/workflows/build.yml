name: Build

# push / PR 时运行全量测试，守住用例基线；发布仍由 v* 标签触发的 publish.yml 负责
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 双代适配需各跑一次全量测试：Boot 3.5 走 Jackson 2 路径，
      # Boot 4.1 走 Jackson 3 路径（步骤内临时改写 parent 版本，checkout 干净无残留），
      # 任一回归都能被 CI 拦下
      matrix:
        include:
          - boot: 3.5.14
            profile: ""
          # Boot 4 job 须显式 -Pboot4：① 引 spring-boot-starter-webmvc-test 提供
          # @AutoConfigureMockMvc 真实注解；② 显式指定 profile 会停用默认激活的
          # compat35（3.5 兼容桥），避免 3.5 包名源码在 Boot 4 树编译失败
          - boot: 4.1.1
            profile: "-Pboot4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test (Boot ${{ matrix.boot }})
        run: |
          if [ "${{ matrix.boot }}" != "3.5.14" ]; then
            sed -i '0,/<version>3\.5\.14<\/version>/s//<version>${{ matrix.boot }}<\/version>/' pom.xml
          fi
          ./mvnw -B -ntp test ${{ matrix.profile }}
